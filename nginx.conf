server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── LAN only ────────────────────────────────────────────────────────────
    # The primary control is the compose port binding; this is the backstop so
    # that a router port-forward or a future `ports: "80:80"` cannot expose the
    # dashboard to the internet. 172.16/12 is here because Docker's userland
    # proxy can rewrite the client address to the bridge gateway.
    allow 127.0.0.0/8;
    allow 10.0.0.0/8;
    allow 172.16.0.0/12;
    allow 192.168.0.0/16;
    allow ::1;
    allow fc00::/7;
    allow fe80::/10;
    deny all;

    # ── No outbound requests ────────────────────────────────────────────────
    # 'unsafe-eval' is required: the bundled dc-runtime evaluates the page's
    # <script type="text/x-dc"> logic via new Function(). 'unsafe-inline' and
    # blob: are required by the self-extracting loader, which mints blob: URLs
    # for React, the fonts and the bundled icons and injects inline <script>.
    # No host is allowlisted for subresources, so the page cannot reach the
    # internet even if a future re-export reintroduces a CDN reference. Clicking
    # a tile is a top-level navigation and is unaffected.
    #
    # form-action stays 'none'. The search bar briefly needed an allowlisted
    # origin here, because a blocked form submit produces no navigation and no
    # visible error — Enter simply did nothing. It now navigates with
    # location.assign instead, which is a top-level navigation and so outside
    # form-action entirely. That keeps this directive fully closed while letting
    # the engine be anything the user picks in Settings, including a
    # plain-http:// box on the LAN that an https: allowlist would have silently
    # dropped.
    #
    # If a future re-export breaks under this policy, the bundle's own error
    # overlay reports the violation; comment this line out to confirm the cause.
    #
    # These are server-level on purpose: an add_header in a nested location
    # REPLACES the inherited set, so caching below uses `expires` instead.
    add_header Content-Security-Policy "default-src 'self' blob: data:; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; font-src 'self' data: blob:; connect-src 'self' blob: data:; frame-src 'self' blob:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'self'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/html text/css application/javascript image/svg+xml application/json;

    # Re-exporting firehome.html and rebuilding should show up on reload.
    location = / {
        expires -1;
        try_files /index.html =404;
    }

    location = /index.html {
        expires -1;
    }

    # Extracted fonts and JavaScript, named by the content uuid they came from,
    # so a rebuild that changes them changes the filename too.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Icons come from two places: the writable overlay on the volume, which
    # updates land in, in front of the set baked into the image. So an update
    # never mutates the image, and dropping the volume reverts to the shipped
    # set. The regex both strips the prefix for try_files and constrains the
    # filename to the shape icons.py will write.
    #
    # svg, webp and png: 690 of the ~3900 icons upstream have no svg, so those
    # arrive as rasters and keep their extension in the URL, which is also what
    # gives the response the right content type.
    #
    # These are third-party images. SVGs render through <img>, which never executes
    # script, but the page CSP needs script-src 'unsafe-inline' for the
    # dc-runtime, so a scripted SVG would run if someone opened it directly. This
    # location gets its own far stricter policy instead.
    location ~ "^/icons/(?<icon>[A-Za-z0-9][A-Za-z0-9._-]*\.(?:svg|webp|png))$" {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
        access_log off;
        # Three layers, most specific first:
        #
        #   resolved/  the overrides. Several icon libraries can be installed at
        #              once and they overlap, so which one wins a shared name is
        #              a user preference — and it lives in a JSON file this
        #              static config cannot read. The api resolves it instead and
        #              hardlinks the winner here whenever the order or the
        #              installed sets change, so nginx only has to look here
        #              first. It holds the overrides alone, not every icon: a
        #              winner already reachable below needs no entry, which keeps
        #              this to a few links rather than a copy of the baked set.
        #   icons-live root: the writable overlay, holding downloads. Reached for
        #              anything resolved/ does not override.
        #   icons/     the set baked into the image.
        #
        # The last two are ordered writable-then-baked, which no preference can
        # contradict: they hold one library's icons, so the api never has to
        # override for their sake. Adding a try_files line for a second library
        # would break that — its position here is fixed at build time, and the
        # preference is not. See IconStore.served_dirs.
        try_files /icons-live/resolved/$icon /icons-live/$icon /icons/$icon =404;
    }

    # Icons fetched from the sites themselves, by the api. Same strict policy as
    # /icons/ — these come from third parties too — and a short expiry, since the
    # name is derived from the site rather than the bytes.
    location ~ "^/favicons/(?<fav>[a-f0-9]{16}\.(?:png|ico|gif|jpg|svg|webp))$" {
        add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; sandbox" always;
        add_header X-Content-Type-Options nosniff always;
        expires 1h;
        access_log off;
        try_files /favicons/$fav =404;
    }

    # Config store. Same origin, so the CSP's connect-src 'self' covers it.
    # Resolved through Docker's DNS on every request rather than once at
    # startup, so recreating the api container doesn't leave a stale IP behind.
    location /api/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $api_upstream "api:8080";
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://$api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
        client_max_body_size 1m;
    }

    # Instagram downloader behind the search bar's "down" button. Same origin,
    # so connect-src and img-src 'self' cover the panel and its thumbnails.
    # Longer timeouts than /api/: yt-dlp's extraction takes seconds, and a zip
    # of a carousel is built before the first byte goes out. Unbuffered so a
    # video streams to the browser instead of spooling to disk here first.
    location /down/ {
        resolver 127.0.0.11 valid=10s ipv6=off;
        set $down_upstream "down:5000";
        rewrite ^/down/(.*)$ /$1 break;
        proxy_pass http://$down_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # The dc-runtime's markup sits in the document as real HTML, so the browser
    # eagerly fetches placeholder attributes like <img src="{{ app.iconSrc }}">
    # while parsing, before the runtime replaces that subtree with the rendered
    # output. The icons themselves are fine; these are the pre-hydration
    # requests. Serve a 1x1 transparent GIF so the image load *succeeds* and
    # goes away quietly — a 204 would clear the 404 but still trip the bundle's
    # "resource failed to load" handler. nginx decodes %7B%7B before matching
    # locations, so this catches them as they appear in the log.
    location ~ "\{\{" {
        access_log off;
        empty_gif;
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location / {
        try_files $uri =404;
    }
}
