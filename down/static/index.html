<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Insta Grabber</title>
<style>
  :root {
    --bg: #f6f6f4; --surface: #fff; --text: #1b1b1b; --muted: #6b6b6b;
    --border: #e2e2de; --accent: #d6336c; --accent-text: #fff; --error: #b42318;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121212; --surface: #1d1d1d; --text: #ececec; --muted: #9a9a9a;
            --border: #2e2e2e; --accent: #f06595; --accent-text: #1a0a10; --error: #ff8a80; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
  h1 { font-size: 1.6rem; margin: 0 0 4px; letter-spacing: -0.01em; }
  .sub { color: var(--muted); margin: 0 0 24px; }
  form { display: flex; gap: 8px; }
  input[type=url] { flex: 1; min-width: 0; padding: 12px 14px; font: inherit; color: inherit;
         background: var(--surface); border: 1px solid var(--border); border-radius: 10px; }
  input[type=url]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button { font: inherit; font-weight: 600; padding: 12px 18px; border-radius: 10px; cursor: pointer;
           border: 1px solid transparent; background: var(--accent); color: var(--accent-text); }
  button.ghost { background: transparent; color: var(--text); border-color: var(--border); font-weight: 500; }
  button:disabled { opacity: .5; cursor: default; }
  .status { margin: 16px 0 0; color: var(--muted); min-height: 1.5em; }
  .status.error { color: var(--error); }
  .meta { margin: 24px 0 12px; }
  .meta strong { display: block; }
  .meta p { margin: 4px 0 0; color: var(--muted); font-size: .9rem; white-space: pre-line;
            overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .toolbar .count { margin-right: auto; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px; }
  .card { position: relative; border-radius: 12px; overflow: hidden; background: var(--surface);
          border: 2px solid var(--border); cursor: pointer; aspect-ratio: 4 / 5; }
  .card.selected { border-color: var(--accent); }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card .check { position: absolute; top: 8px; left: 8px; width: 26px; height: 26px; border-radius: 50%;
                 background: rgba(0,0,0,.45); border: 2px solid #fff; display: grid; place-items: center;
                 color: #fff; font-size: 14px; }
  .card.selected .check { background: var(--accent); border-color: var(--accent); }
  .card .badge { position: absolute; bottom: 8px; left: 8px; background: rgba(0,0,0,.65); color: #fff;
                 font-size: .75rem; padding: 2px 8px; border-radius: 999px; }
  .card a.one { position: absolute; bottom: 8px; right: 8px; background: rgba(0,0,0,.65); color: #fff;
                font-size: .75rem; padding: 2px 8px; border-radius: 999px; text-decoration: none; }
  @media (max-width: 520px) {
    form { flex-direction: column; }
    .grid { grid-template-columns: repeat(2, 1fr); }
  }
</style>
</head>
<body>
<main>
  <h1>Insta Grabber</h1>
  <p class="sub">Paste an Instagram post or reel link, pick the media you want, and download.</p>

  <form id="form">
    <input id="url" type="url" required placeholder="https://www.instagram.com/p/…" autocomplete="off">
    <button id="go" type="submit">Fetch</button>
  </form>
  <div id="status" class="status"></div>

  <section id="result" hidden>
    <div class="meta"><strong id="user"></strong><p id="caption"></p></div>
    <div class="toolbar">
      <span class="count" id="count"></span>
      <button class="ghost" id="toggleAll" type="button">Select all</button>
      <button id="download" type="button">Download selected</button>
    </div>
    <div class="grid" id="grid"></div>
  </section>
</main>

<script>
const $ = id => document.getElementById(id);
let post = null;
const selected = new Set();

const fileUrl = (item, inline) =>
  `/api/file?url=${encodeURIComponent(inline ? item.thumbnail : item.url)}&name=${encodeURIComponent(item.filename)}${inline ? "&inline=1" : ""}`;

function setStatus(msg, isError = false) {
  $("status").textContent = msg;
  $("status").className = "status" + (isError ? " error" : "");
}

function refresh() {
  document.querySelectorAll(".card").forEach(c =>
    c.classList.toggle("selected", selected.has(+c.dataset.i)));
  const n = selected.size, total = post.items.length;
  $("count").textContent = `${n} of ${total} selected`;
  $("download").disabled = n === 0;
  $("toggleAll").textContent = n === total ? "Select none" : "Select all";
}

function render() {
  $("user").textContent = post.username ? "@" + post.username : "";
  $("caption").textContent = post.caption || "";
  $("grid").innerHTML = "";
  post.items.forEach((item, i) => {
    const card = document.createElement("div");
    card.className = "card";
    card.dataset.i = i;
    card.innerHTML = `
      <img loading="lazy" alt="">
      <span class="check">✓</span>
      <span class="badge">${item.type === "video" ? "▶ Video" : "Photo"}</span>
      <a class="one" title="Download just this one">↓</a>`;
    card.querySelector("img").src = item.thumbnail ? fileUrl(item, true) : "";
    const a = card.querySelector("a.one");
    a.href = fileUrl(item, false);
    a.addEventListener("click", e => e.stopPropagation());
    card.addEventListener("click", () => {
      selected.has(i) ? selected.delete(i) : selected.add(i);
      refresh();
    });
    $("grid").appendChild(card);
  });
  $("result").hidden = false;
  refresh();
}

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  $("go").disabled = true;
  $("result").hidden = true;
  setStatus("Fetching post…");
  try {
    const res = await fetch("/api/info", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ url: $("url").value })
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Request failed");
    if (!data.items.length) throw new Error("No downloadable media found in this post.");
    post = data;
    selected.clear();
    post.items.forEach((_, i) => selected.add(i));
    setStatus("");
    render();
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    $("go").disabled = false;
  }
});

$("toggleAll").addEventListener("click", () => {
  if (selected.size === post.items.length) selected.clear();
  else post.items.forEach((_, i) => selected.add(i));
  refresh();
});

$("download").addEventListener("click", async () => {
  const items = [...selected].sort((a, b) => a - b).map(i => post.items[i]);
  if (items.length === 1) { location.href = fileUrl(items[0], false); return; }
  $("download").disabled = true;
  setStatus(`Zipping ${items.length} files…`);
  try {
    const res = await fetch("/api/zip", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: post.shortcode, files: items })
    });
    if (!res.ok) throw new Error("Download failed (" + res.status + ")");
    const blob = await res.blob();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = (post.shortcode || "instagram") + ".zip";
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    setStatus("");
  } catch (err) {
    setStatus(err.message, true);
  } finally {
    refresh();
  }
});
</script>
</body>
</html>
