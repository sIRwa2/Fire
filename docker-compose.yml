services:
  # Kept as "firehome" rather than renamed to "web": the container_name is
  # already taken by the running deployment, and a rename would collide.
  firehome:
    build: .
    image: firehome:local
    container_name: firehome
    restart: unless-stopped
    ports:
      # Reachable from the LAN, never from the internet. Set FIREHOME_BIND to a
      # specific LAN address (e.g. 192.168.1.50) to pin it to one interface, or
      # to 127.0.0.1 for this host only. nginx additionally rejects any client
      # outside RFC1918 / loopback — see nginx.conf.
      - "${FIREHOME_BIND:-0.0.0.0}:${FIREHOME_PORT:-8080}:80"
    volumes:
      # Updated icons, served in front of the set baked into the image.
      - firehome-icons:/usr/share/nginx/html/icons-live:ro
    depends_on:
      api:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

  # Server-side config store. Not published — only nginx talks to it, via
  # /api/ on the compose network.
  api:
    build: ./api
    image: firehome-api:local
    container_name: firehome-api
    restart: unless-stopped
    volumes:
      - firehome-data:/data
      - firehome-icons:/data/icons
      # The shipped icon set, read-only, so the updater can diff against it by
      # blob sha and download only what actually changed.
      - ./svg:/srv/icons-baked:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp

volumes:
  firehome-data:
  firehome-icons:
